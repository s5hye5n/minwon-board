<script>
const posts = [
  { no: 1048, area: "신방동", title: "학교 앞 사거리에 신호등을 설치해 주세요", name: "박**", date: "2026.10.14", views: 152,
    body: "저는 신방동 ○○초등학교에 다니는 아이의 엄마입니다. 아이는 매일 아침 학교 앞 사거리를 건너 학교에 갑니다.\n\n이 사거리에는 신호등이 없어서, 아이들이 길을 건너려 해도 차가 잘 멈추지 않습니다. 아이들은 차가 지나가기를 한참 기다리거나, 뛰어서 건너다 차에 부딪힐 뻔합니다.\n\n근처에 아파트가 새로 생기면서 오가는 차는 크게 늘었는데, 도로 시설은 예전 그대로입니다. 신호등이나 과속 방지턱을 설치해 주세요.",
    dept: "천안시 교통 담당 부서", adate: "2026.10.21",
    answer: "안녕하십니까. 민원을 보내 주셔서 감사합니다.\n\n현장을 확인한 결과, 아파트 입주 후 오가는 차가 늘어 길을 건너는 사람의 안전이 걱정되는 것을 확인하였습니다.\n\n신호등을 설치하려면 경찰서의 심의가 필요하여, 경찰서에 신호등 설치를 요청하였습니다. 결과가 나오기 전까지는 과속 방지턱과 '어린이 보호 구역' 바닥 표시를 먼저 설치하겠습니다. 또한 학교와 협의하여 등교 시간에 교통 봉사자가 함께하도록 하겠습니다." },

  { no: 1052, area: "통정지구", title: "자전거 전용 도로를 만들어 주세요", name: "이**", date: "2026.10.17", views: 98,
    body: "저는 통정지구에 사는 초등학교 4학년입니다. 학교와 공원에 자전거를 타고 다니는데, 우리 동네에는 자전거가 다니는 길이 따로 없습니다.\n\n차도로 가면 바로 옆으로 차가 지나가서 무섭고, 인도로 가면 걷는 사람들과 부딪힐 뻔합니다. 친구들도 똑같이 불편하다고 합니다.\n\n새 동네를 만들 때 자전거 길은 생각하지 않은 것 같아요. 자전거 전용 도로를 만들어 주세요.",
    dept: "천안시 도로 담당 부서", adate: "2026.10.27",
    answer: "안녕하십니까. 소중한 의견 감사합니다.\n\n말씀하신 구간은 도로 폭이 좁아 바로 자전거 전용 도로를 만들기 어렵습니다.\n\n우선 인도 일부에 색을 칠해 자전거가 다니는 길과 사람이 걷는 길을 나누겠습니다. 앞으로 공원과 학교를 잇는 자전거 도로 계획을 세우고 예산을 마련하겠습니다.\n\n자전거를 탈 때에는 꼭 안전모를 써 주시기 바랍니다." },

  { no: 1055, area: "신방동", title: "공원 옆 쓰레기 냄새 때문에 창문을 열 수 없어요", name: "최**", date: "2026.10.20", views: 121,
    body: "저는 신방동 근린공원 바로 옆 아파트에 사는 주민입니다.\n\n공원 옆 쓰레기 버리는 곳에서 냄새가 너무 심해서, 여름에는 창문을 열 수가 없습니다. 고양이와 비둘기가 봉투를 뜯어 쓰레기가 길에 흩어지고, 공원에 산책 온 사람들도 코를 막고 지나갑니다.\n\n음식물이 묻은 재활용품을 그대로 버리거나, 정해진 날이 아닌데 쓰레기를 내놓는 사람이 많기 때문입니다. 해결 방법을 찾아 주세요.",
    dept: "천안시 청소 담당 부서", adate: "2026.10.28",
    answer: "안녕하십니까. 불편을 드려 죄송합니다.\n\n현장을 확인하고, 쓰레기를 함부로 버리지 않도록 감시 카메라와 안내판을 설치하였습니다. 또한 주민센터와 함께 분리배출 방법을 알리는 안내문을 각 가정에 나누어 드리겠습니다.\n\n쓰레기 문제는 시의 노력만으로는 해결하기 어렵습니다. 주민 여러분께서 분리배출 규칙을 함께 지켜 주시기 바랍니다." },

  { no: 1061, area: "", title: "주민등록등본은 어디서 뗄 수 있나요?", name: "오**", date: "2026.10.23", views: 37,
    body: "저는 신방동에 사는 주민입니다.\n\n다음 주에 서류를 내야 해서 주민등록등본이 필요합니다. 주민센터에 꼭 가야 하나요? 집에서 뗄 수 있는 방법이 있으면 알려 주세요.",
    dept: "천안시 민원 담당 부서", adate: "2026.10.24",
    answer: "안녕하십니까.\n\n주민등록등본은 가까운 주민센터에 방문하시거나, 온라인 정부 민원 누리집(정부24)에서 집에서도 발급받으실 수 있습니다. 주민센터 등에 있는 무인 민원 발급기도 이용하실 수 있습니다." },

  { no: 1064, area: "통정지구", title: "저녁마다 골목 주차 때문에 차가 지나갈 수 없어요", name: "정**", date: "2026.10.25", views: 113,
    body: "저는 통정지구 상가 뒤 골목에 사는 주민입니다.\n\n저녁 퇴근 시간이 지나면 골목 양쪽에 차들이 빽빽하게 주차되어, 차 한 대도 지나가기 어렵습니다. 집에 들어오려면 한참을 돌아가야 하고, 불이 나면 소방차가 들어오지 못할까 걱정됩니다.\n\n동네에 사는 사람과 상가를 찾는 사람은 많아졌는데 주차장은 부족합니다. 공영 주차장을 만들어 주시거나 단속을 해 주세요.",
    dept: "천안시 교통 담당 부서", adate: "2026.11.03",
    answer: "안녕하십니까. 민원을 보내 주셔서 감사합니다.\n\n해당 골목은 소방차가 다닐 길을 확보하기 위해 한쪽을 주차 금지 구역으로 정하고 단속하겠습니다.\n\n부족한 주차 공간을 늘리기 위해 근처 빈 땅에 공영 주차장을 만드는 방안을 검토하고 있습니다. 또한 저녁 시간에 학교와 교회 주차장을 주민에게 열어 주는 '주차장 함께 쓰기'도 추진하겠습니다." },

  { no: 1067, area: "통정지구", title: "층간소음 때문에 이웃끼리 다툼이 계속돼요", name: "윤**", date: "2026.10.28", views: 176,
    body: "저는 통정지구 ○○아파트 5층에 사는 주민입니다.\n\n저녁마다 위층에서 뛰는 소리와 가구를 끄는 소리가 들려, 아이가 숙제에 집중하지 못하고 밤에 잠도 설칩니다. 여러 번 부탁드렸지만 나아지지 않았고, 이제는 엘리베이터에서 만나면 서로 얼굴을 붉히게 되었습니다.\n\n관리사무소에 물어보니, 우리 단지에서만 이런 일로 들어오는 이야기가 한 달에 열 건이 넘는다고 합니다. 이웃끼리 다투지 않고 해결할 수 있는 방법을 알려 주세요.",
    dept: "천안시 공동주택 담당 부서", adate: "2026.11.05",
    answer: "안녕하십니까. 많이 불편하셨을 것 같습니다.\n\n층간소음은 서로 직접 따지다 보면 다툼이 커지기 쉽습니다. 층간소음 상담 기관에 신청하시면 전문 상담가가 두 집 사이에서 이야기를 나누도록 도와 드립니다.\n\n또한 관리사무소와 입주자 대표 회의에, 단지 안에서 함께 지킬 '생활 소음 규칙'을 만들도록 안내하였습니다. 주민 여러분이 서로 조금씩 배려해 주시면 큰 도움이 됩니다." },

  { no: 1070, area: "신방동", title: "아침 7시부터 공사 소리 때문에 잠을 잘 수 없어요", name: "한**", date: "2026.10.30", views: 89,
    body: "저는 신방동 공사장 바로 옆 주택에 사는 주민입니다.\n\n아침 7시도 되기 전부터 기계 소리와 쿵쿵거리는 소리가 나서 잠을 제대로 잘 수 없습니다. 우리 집에는 어린 아기와 할머니가 계셔서 더 힘듭니다. 이웃들도 같은 이야기를 합니다.\n\n공사를 할 수 있는 시간이 정해져 있는 것으로 아는데, 지켜지지 않는 것 같습니다. 확인해 주세요.",
    dept: "천안시 환경 담당 부서", adate: "2026.11.06",
    answer: "안녕하십니까. 불편을 드려 죄송합니다.\n\n현장에서 소음을 재어 본 결과, 기준보다 큰 소음이 확인되어 공사 업체에 고치도록 명령하였습니다.\n\n앞으로 이른 아침과 늦은 저녁에는 소리가 큰 작업을 하지 않도록 하고, 소리를 막는 방음벽을 더 튼튼하게 세우도록 하였습니다. 같은 일이 다시 생기면 벌금(과태료)을 물리겠습니다." },

  { no: 1073, area: "", title: "우리 집 보일러가 고장 났어요", name: "강**", date: "2026.11.02", views: 41,
    body: "저는 신방동에 사는 주민입니다.\n\n어제부터 우리 집 보일러가 작동하지 않아 집이 너무 춥습니다. 어디에 연락해야 고칠 수 있나요? 시청에서 고쳐 주실 수 있나요?",
    dept: "천안시 민원 담당 부서", adate: "2026.11.02",
    answer: "안녕하십니까.\n\n개인 집의 보일러 고장은 시에서 직접 고쳐 드리기 어렵습니다. 보일러 회사의 서비스 센터나 가까운 설비 업체에 연락하여 수리를 받으시기 바랍니다." },

  { no: 1076, area: "신방동", title: "길고양이 밥 주는 문제로 이웃끼리 다퉈요", name: "서**", date: "2026.11.04", views: 134,

let showAnswers = false;
const isTeacher = new URLSearchParams(location.search).has('teacher');
if (!isTeacher) document.getElementById('teacherBtn').style.display = 'none';


function toggleAnswers() {
  if (window.pushShow) window.pushShow(!showAnswers);
  else setShow(!showAnswers);
}

function setShow(v) {
  showAnswers = !!v;
  const btn = document.getElementById('teacherBtn');
  btn.textContent = showAnswers ? '답변 숨기기' : '답변 보이기';
  btn.classList.toggle('on', showAnswers);
  document.getElementById('answerBox').style.display = showAnswers ? 'block' : 'none';
  render();
}

function render() {
  const q = document.getElementById('q').value.trim();
  const list = posts.slice().sort((a, b) => b.no - a.no)
    .filter(p => !q || p.title.includes(q) || p.area.includes(q));
  document.getElementById('cnt').textContent = list.length;
  document.getElementById('rows').innerHTML = list.map(p => `
    <tr onclick="openPost(${p.no})">
      <td class="hide-sm muted">${p.no}</td>
      <td class="title">${p.area ? `<span class="tag">${p.area}</span>` : ''}${p.title}</td>
      <td class="muted">${p.name}</td>
      <td class="hide-sm muted">${p.date}</td>
      ${showAnswers ? '<td class="done">답변 완료</td>' : '<td class="wait">접수</td>'}
    </tr>`).join('');
}

function openPost(no) {
  const p = posts.find(x => x.no === no);
  document.getElementById('dTitle').textContent = p.title;
  document.getElementById('dMeta').innerHTML =
    `<span>작성자 ${p.name}</span><span>작성일 ${p.date}</span>${p.area ? `<span>지역 ${p.area}</span>` : ''}<span>조회 ${p.views}</span>`;
  document.getElementById('dBody').textContent = p.body;
  document.getElementById('aMeta').textContent = `${p.dept} · ${p.adate}`;
  document.getElementById('aBody').textContent = p.answer;
  document.getElementById('answerBox').style.display = showAnswers ? 'block' : 'none';
  document.getElementById('list').style.display = 'none';
  document.getElementById('detail').style.display = 'block';
  window.scrollTo(0, 0);
}

function showList() {
  document.getElementById('detail').style.display = 'none';
  document.getElementById('list').style.display = 'block';
}

render();
</script>
